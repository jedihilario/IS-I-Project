[project]
name = "is-i-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jedihilario", email = "hyanezbertola@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "flask>=3.1.3",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
is-i-project = "is_i_project:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
