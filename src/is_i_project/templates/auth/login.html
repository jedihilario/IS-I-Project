<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Iniciá sesión en QAI para participar en la comunidad de preguntas y respuestas." />
  <title>Iniciar sesión — QAI</title>
  <script>
    (function() {
      var saved = localStorage.getItem('qai-theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%232563eb'/><text x='50' y='68' font-family='sans-serif' font-weight='700' font-size='56' fill='white' text-anchor='middle'>Q</text></svg>" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
</head>
<body>

<div class="auth-page">
  <div style="position:fixed;top:var(--space-4);right:var(--space-4);">
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Cambiar modo de color">
      <span data-theme-label>Modo claro</span>
    </button>
  </div>

  <main style="width:100%;max-width:420px;">
    <div class="auth-card" role="main">

      <!-- Logo -->
      <div class="auth-logo">
        <a href="{{ url_for('home') }}" id="auth-logo-link">
          <div class="auth-logo-icon" aria-hidden="true">Q</div>
        </a>
        <h1 class="auth-title">Bienvenido a QAI</h1>
        <p class="auth-subtitle">Iniciá sesión para hacer preguntas, responder y votar.</p>
      </div>

      <!-- Flash messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="toast {{ category }}" style="position:relative;margin-bottom:var(--space-4);animation:none;" role="alert">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <!-- Form -->
      <form method="POST" action="{{ url_for('login') }}" data-validate id="login-form" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

        <div class="form-group">
          <label for="login-email" class="form-label">Email</label>
          <input
            type="email"
            id="login-email"
            name="email"
            placeholder="tu@email.com"
            required
            aria-required="true"
            autocomplete="email"
            value="{{ request.form.email | default('') }}"
          />
          <span class="form-error" id="login-email-error" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="login-password" class="form-label" style="display:flex;justify-content:space-between;">
            <span>Contraseña</span>
            <a href="{{ url_for('forgot_password') }}" style="font-weight:400;font-size:var(--text-xs);" id="link-forgot">¿Olvidaste tu contraseña?</a>
          </label>
          <div style="position:relative;">
            <input
              type="password"
              id="login-password"
              name="password"
              placeholder="••••••••"
              required
              aria-required="true"
              autocomplete="current-password"
            />
            <button
              type="button"
              id="toggle-password"
              style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:var(--text-xs);font-weight:600;"
              aria-label="Mostrar/ocultar contraseña"
            >Mostrar</button>
          </div>
          <span class="form-error" id="login-password-error" role="alert"></span>
        </div>

        <div style="display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-5);">
          <input type="checkbox" id="remember-me" name="remember_me" value="1"
                 style="width:16px;height:16px;accent-color:var(--primary);cursor:pointer;" />
          <label for="remember-me" style="font-size:var(--text-sm);color:var(--text-secondary);cursor:pointer;">
            Recordarme en este dispositivo
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-login-submit">
          Iniciar sesión
        </button>
      </form>

      <div class="auth-divider">o</div>

      <div class="auth-footer">
        ¿No tenés cuenta?
        <a href="{{ url_for('register') }}" id="link-to-register" style="font-weight:600;">
          Registrarse gratis →
        </a>
      </div>

    </div>
  </main>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script>
  const toggle = document.getElementById('toggle-password');
  const pwd    = document.getElementById('login-password');
  if (toggle && pwd) {
    toggle.addEventListener('click', () => {
      const isHidden = pwd.type === 'password';
      pwd.type = isHidden ? 'text' : 'password';
      toggle.textContent = isHidden ? 'Ocultar' : 'Mostrar';
    });
  }
</script>
</body>
</html>
