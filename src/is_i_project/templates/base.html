<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{% block meta_description %}Plataforma colaborativa de preguntas y respuestas con asistencia de Inteligencia Artificial.{% endblock %}" />
  <title>{% block title %}QAI — Plataforma Q&A con IA{% endblock %}</title>

  <!-- Favicon (emoji fallback) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>" />

  <!-- Main CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />

  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- Componente: Navbar superior -->
  {% include 'components/navbar.html' %}

  <!-- Mobile overlay -->
  <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

  <!-- Layout Principal -->
  <div class="layout">

    <!-- Componente: Menú Lateral Izquierdo -->
    {% include 'components/sidebar_left.html' %}

    <!-- Contenido Principal -->
    <main class="main-content" id="main-content" role="main">
      <!-- Componente: Mensajes Flash -->
      {% include 'components/flash_messages.html' %}

      {% block content %}{% endblock %}
    </main>

  </div><!-- /layout -->

  <!-- Toast container dinámico (manejado por main.js) -->
  <div class="toast-container" id="toast-container" role="status" aria-live="polite"></div>

  <!-- Main JS -->
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
